version: 2

models:
  - name: fct_orders_fulfillments
    description: "Table de faits — commandes avec indicateurs OTIF, financiers et logistiques"
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: warehouse_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouses')
                field: warehouse_id
      - name: geo_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geo_id
      - name: carrier_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_carriers')
                field: carrier_id
      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: is_otif
        description: "1 si On-Time AND In-Full, sinon 0"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: quantity
        data_tests:
          - not_null
      - name: sales_amount
        data_tests:
          - not_null

  - name: fct_inventory_levels
    description: "Table de faits — niveaux de stock modélisés par flux sortants cumulés"
    columns:
      - name: date_key
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: warehouse_id
        data_tests:
          - not_null
      - name: total_quantity_sold
      - name: cumulative_units_dispatched

  - name: agg_orders_daily
    description: "Table d'agrégat journalier par produit, marché, mode, segment"
    columns:
      - name: date_key
        data_tests:
          - not_null
      - name: total_orders
      - name: total_sales
      - name: total_profit
      - name: otif_orders
      - name: late_delivery_orders

  - name: agg_orders_monthly
    description: "Table d'agrégat mensuel par marché, catégorie, mode, segment"
    columns:
      - name: year_month
        data_tests:
          - not_null
      - name: total_orders
      - name: otif_orders
      - name: total_profit
