name: 'supply_chain_dbt'
version: '2.0.0'

profile: 'SupplyChain_Profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  supply_chain_dbt:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: ephemeral
    dimensions:
      +schema: gold
      +materialized: table
    facts:
      +schema: gold
      +materialized: table
    marts:
      +schema: analytics
      +materialized: view

snapshots:
  supply_chain_dbt:
    +target_schema: silver
    +target_database: SupplyChain_DW
